plugins {
    id 'com.android.application'
}
android {
    namespace 'com.mohamadhh.goldenclover'
    compileSdk 35
    defaultConfig {
        applicationId "com.mohamadhh.goldenclover"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "com.mohamadhh.goldenclover.SmokeInstrumentation"
    }
    androidResources { noCompress += ["wav"] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

