<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050207;font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}body{display:flex;align-items:center;justify-content:center}
#v{position:relative;width:min(100vw,177.777vh);height:min(100vh,56.25vw);aspect-ratio:16/9;background:url('file_00000000a0588246ba8d5de301606f3d.png') center/100% 100% no-repeat;overflow:hidden;box-shadow:0 0 80px #000}
#reels{position:absolute;left:21.3%;top:24.6%;width:57.2%;height:56.3%;display:grid;grid-template-columns:repeat(5,1fr);gap:.22%;padding:.25% .3%;overflow:hidden}
.reel{display:grid;grid-template-rows:repeat(3,1fr);overflow:hidden}.cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 .35vw .25vw rgba(0,0,0,.65));transform:translateZ(0)}.cell.flash:after{content:"";position:absolute;inset:8%;border-radius:12%;box-shadow:0 0 1.5vw #ffe46a,inset 0 0 1.2vw #fff7a5;animation:pulse .45s alternate 5}
.spinning .cell img{animation:blur .11s linear infinite}.stop .cell img{animation:bounce .36s cubic-bezier(.2,1.8,.3,1)}@keyframes blur{50%{transform:translateY(14%) scaleY(.82);filter:blur(3px) brightness(1.2)}}@keyframes bounce{0%{transform:translateY(-35%) scaleY(.75)}65%{transform:translateY(6%) scaleY(1.08)}100%{transform:none}}@keyframes pulse{to{filter:brightness(1.8)}}
#spin,#auto,#betHit,#menuHit,#soundHit,#bonusHit{position:absolute;background:transparent;border:0;z-index:20}#spin{right:4.3%;bottom:3.7%;width:10.8%;height:18.7%;border-radius:50%}#auto{right:16.2%;bottom:5.6%;width:8.7%;height:10.5%}#betHit{left:35.5%;bottom:4.7%;width:17%;height:11%}#menuHit{left:4.2%;bottom:3%;width:8%;height:12%}#soundHit{right:12.2%;top:2.1%;width:4.3%;height:7%}#bonusHit{left:4.6%;top:59.2%;width:15.2%;height:13%}
#credit,#bet,#win{position:absolute;bottom:6.4%;height:5.5%;display:flex;align-items:center;justify-content:center;color:#fff7cf;font-weight:900;text-shadow:0 2px 4px #000;font-size:clamp(14px,2.2vw,36px);z-index:10;background:rgba(2,14,10,.88);border-radius:8px}
#credit{left:15.4%;width:16.6%}#bet{left:39.3%;width:10.3%}#win{left:56.3%;width:14.2%}
#betMenu{position:absolute;left:50%;bottom:17%;transform:translateX(-50%) scale(.92);opacity:0;pointer-events:none;z-index:40;background:linear-gradient(#211208,#070503);border:.28vw solid #f5bd45;border-radius:1vw;padding:1.2vw;display:grid;grid-template-columns:repeat(4,1fr);gap:.65vw;box-shadow:0 0 4vw #000;transition:.18s}
#betMenu.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}.bo{min-width:8vw;padding:.7vw 1vw;background:linear-gradient(#513316,#170d05);border:.12vw solid #d99b32;border-radius:.7vw;color:#fff2b5;font-size:1.35vw;font-weight:900}
#overlay{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(86,255,76,.25),rgba(1,14,6,.94) 68%)}#overlay.show{display:flex}.bonusCard{text-align:center;color:#fff6c9;text-shadow:0 0 1vw #f6a500;animation:zoom .4s ease}.bell{font-size:12vw;filter:drop-shadow(0 0 1.3vw #ffd34a);animation:ring .7s infinite alternate}.bonusCard h1{font-size:4vw;margin:.3vw 0;color:#ffdf67}.bonusCard p{font-size:2vw;margin:.3vw}
@keyframes zoom{from{transform:scale(.55);opacity:0}}@keyframes ring{to{transform:rotate(8deg) scale(1.08)}}.coin{position:absolute;width:1.1vw;height:1.1vw;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff5a8,#ffc218 45%,#a75600);box-shadow:0 0 .45vw #ffcf3a;pointer-events:none;z-index:80;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(900deg);opacity:.2}}
</style></head><body><div id="v"><div id="reels"></div><div id="credit"></div><div id="bet"></div><div id="win"></div>
<button id="spin"></button><button id="auto"></button><button id="betHit"></button><button id="menuHit"></button><button id="soundHit"></button><button id="bonusHit"></button>
<div id="betMenu"></div><div id="overlay"><div class="bonusCard"><div class="bell">🔔</div><h1>CLOVER BONUS</h1><p id="bonusText">3 RESPINS REMAINING</p></div></div></div>
<script>
const S=['bell','seven','clover','lemon','orange','grape','watermelon','diamond','pot'], bets=[5,10,20,35,50,75,100,150,200];
let credit=1000,bet=20,win=0,busy=false,sound=true,auto=false,ac=null; const R=document.getElementById('reels');
for(let c=0;c<5;c++){let r=document.createElement('div');r.className='reel';for(let y=0;y<3;y++){let d=document.createElement('div');d.className='cell';let i=document.createElement('img');i.src='symbols/'+S[(c*3+y)%S.length]+'.webp';d.appendChild(i);r.appendChild(d)}R.appendChild(r)}
function ui(){creditEl.textContent=credit.toFixed(2)+' TL';betEl.textContent=bet.toFixed(2)+' TL';winEl.textContent=win.toFixed(2)+' TL'}const creditEl=document.getElementById('credit'),betEl=document.getElementById('bet'),winEl=document.getElementById('win');
const bm=document.getElementById('betMenu');bets.forEach(v=>{let b=document.createElement('button');b.className='bo';b.textContent=v.toFixed(2)+' TL';b.onclick=()=>{bet=v;bm.classList.remove('show');ui();clickSound()};bm.appendChild(b)});
function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume();return ac}function beep(f,d=.08,type='sine',vol=.08){if(!sound)return;let a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}function clickSound(){beep(520,.05,'triangle',.05)}function spinSound(){beep(120,.5,'sawtooth',.04);setTimeout(()=>beep(180,.35,'sawtooth',.03),130)}function stopSound(i){beep(260+i*45,.055,'square',.045)}function winSound(){[620,760,910,1180].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.07),i*95))}function jackpotSound(){[330,440,660,880,990,1320].forEach((f,i)=>setTimeout(()=>beep(f,.28,'sine',.08),i*110))}
function coins(n=45){let v=document.getElementById('v');for(let i=0;i<n;i++){let c=document.createElement('i');c.className='coin';c.style.left=(15+Math.random()*70)+'%';c.style.top='-5%';c.style.setProperty('--dx',((Math.random()-.5)*35)+'vw');c.style.animationDelay=(Math.random()*.5)+'s';v.appendChild(c);setTimeout(()=>c.remove(),2200)}}
function rnd(){return S[Math.floor(Math.random()*S.length)]}function setReel(r){[...r.children].forEach(x=>{x.classList.remove('flash');x.querySelector('img').src='symbols/'+rnd()+'.webp'})}
async function bonus(mult){let o=document.getElementById('overlay');o.classList.add('show');jackpotSound();coins(80);await new Promise(r=>setTimeout(r,1700));o.classList.remove('show');return bet*mult}
async function spin(){ctx();if(busy||credit<bet)return;busy=true;win=0;credit-=bet;ui();document.body.classList.add('spinning');spinSound();let rs=[...document.querySelectorAll('.reel')];for(let t=0;t<11;t++){rs.forEach(setReel);await new Promise(r=>setTimeout(r,58))}document.body.classList.remove('spinning');for(let i=0;i<5;i++){setReel(rs[i]);rs[i].classList.add('stop');stopSound(i);await new Promise(r=>setTimeout(r,115));rs[i].classList.remove('stop')}
let cl=[...document.querySelectorAll('.cell img')].filter(x=>x.src.includes('clover')).length;if(cl>=4||Math.random()<.065)win=await bonus(5+Math.floor(Math.random()*16));else if(Math.random()<.28)win=bet*(1+Math.floor(Math.random()*5));
if(win){credit+=win;winSound();coins(28);[...document.querySelectorAll('.cell')].filter(()=>Math.random()<.3).forEach(x=>x.classList.add('flash'))}ui();busy=false;if(auto)setTimeout(spin,650)}
document.getElementById('spin').onclick=spin;document.getElementById('betHit').onclick=()=>{ctx();bm.classList.toggle('show');clickSound()};document.getElementById('auto').onclick=()=>{ctx();auto=!auto;clickSound();if(auto&&!busy)spin()};document.getElementById('soundHit').onclick=()=>{ctx();sound=!sound;if(sound)clickSound()};document.getElementById('bonusHit').onclick=async()=>{ctx();if(!busy&&credit>=bet*20){credit-=bet*20;ui();busy=true;win=await bonus(12+Math.floor(Math.random()*20));credit+=win;ui();busy=false}};document.addEventListener('pointerdown',()=>ctx(),{once:true});ui();
</script></body></html>
