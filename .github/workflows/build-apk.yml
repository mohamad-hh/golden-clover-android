name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package uploaded artwork into app assets
        run: |
          cp file_00000000a0588246ba8d5de301606f3d.png app/src/main/assets/file_00000000a0588246ba8d5de301606f3d.png
          ls -lh app/src/main/assets/file_00000000a0588246ba8d5de301606f3d.png
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify artwork is packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep file_00000000a0588246ba8d5de301606f3d.png
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Golden-Clover.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Golden-Clover-APK
          path: Golden-Clover.apk
          if-no-files-found: error
