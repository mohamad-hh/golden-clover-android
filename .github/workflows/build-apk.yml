name: Build and verify Clover Inferno Demo
on:
  push:
    branches: [main, codex/inferno-demo]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-clover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test pure gameplay and safe viewport logic
        run: ./tools/test_logic.sh | tee logic-test.log
      - name: Build native APK and Android smoke test
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Inspect APK and verify every packaged asset
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Clover-Inferno-Demo.apk
          unzip -l Clover-Inferno-Demo.apk | tee apk-contents.txt
          python3 tools/verify_apk.py Clover-Inferno-Demo.apk | tee apk-verification.txt
          stat --printf='APK size: %s bytes\n' Clover-Inferno-Demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clover-Inferno-Demo-APK
          path: Clover-Inferno-Demo.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android input and rendering checks at four aspect ratios
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash tools/android_smoke.sh
      - name: Upload verification and Android visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clover-Inferno-Verification
          path: |
            logic-test.log
            apk-contents.txt
            apk-verification.txt
            qa/
          if-no-files-found: error
      - name: Upload compact visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clover-Inferno-Visual-Review
          path: |
            qa/screenshots/16x9-*.png
            qa/screenshots/*-base.png
            qa/screenshots/20x9-all-features.png
            qa/screenshots/20x9-grand.png
          if-no-files-found: error
